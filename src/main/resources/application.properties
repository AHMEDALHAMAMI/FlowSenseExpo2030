spring.application.name=FlowSense
server.port=8080

# Cloud MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jackson.time-zone=Asia/Riyadh

# FlowSense settings
flowsense.call-ahead-minutes=5
flowsense.return-window-minutes=10
flowsense.default-app-share=0.4
# Start the traffic simulator automatically on startup (demo only)
flowsense.simulation.auto-start=true
