spring.application.name=FlowSense
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${{MySQL.MYSQLHOST}}:${{MySQL.MYSQLPORT}}/${{MySQL.MYSQLDATABASE}}
SPRING_DATASOURCE_USERNAME=${{MySQL.MYSQLUSER}}
SPRING_DATASOURCE_PASSWORD=${{MySQL.MYSQLPASSWORD}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jackson.time-zone=Asia/Riyadh

flowsense.call-ahead-minutes=5
flowsense.return-window-minutes=10
flowsense.default-app-share=0.4
flowsense.simulation.auto-start=true