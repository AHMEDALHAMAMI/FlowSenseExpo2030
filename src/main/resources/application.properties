spring.application.name=FlowSense
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:flowsense}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Riyadh
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jackson.time-zone=Asia/Riyadh

# FlowSense settings
flowsense.call-ahead-minutes=5
flowsense.return-window-minutes=10
flowsense.default-app-share=0.4
# Start the traffic simulator automatically on startup (demo only)
flowsense.simulation.auto-start=true